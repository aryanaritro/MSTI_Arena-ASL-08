<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f2" />
    <script>
      try {
        const savedTheme = localStorage.getItem('waqt-theme');
        const initialTheme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = initialTheme;
        document.querySelector('meta[name="theme-color"]').content = initialTheme === 'dark' ? '#030824' : '#f7f6f2';
      } catch {}
    </script>
    <meta name="description" content="Discover thoughtfully selected timepieces at WAQT, Mr. Karim’s E-Commerce Hub." />
    <title>WAQT — Time, considered.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
